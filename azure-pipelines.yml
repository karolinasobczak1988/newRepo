trigger: 
  branches:
    include:
      - main  # Runs when you push to the main branch

pool:
  name: Default  # Uses self-hosted agent

stages:
- stage: Checkout
  displayName: 'Checkout Repository'
  jobs:
    - job: Checkout
      steps:
        - checkout: self  # Clones the GitHub repository

- stage: Install_Dependencies
  displayName: 'Install Dependencies'
  jobs:
    - job: Install
      steps:
        - script: |
            echo Cleaning up disk space...
            if exist node_modules rmdir /s /q node_modules
            if exist package-lock.json del package-lock.json
            npm cache clean --force

            echo Installing npm dependencies...
            npm install --legacy-peer-deps
            npx playwright install  # Installs Playwright browsers
          displayName: 'Install npm packages'

- stage: Build
  displayName: 'Prepare Application for Deployment'
  jobs:
    - job: BuildApp
      steps:
        - script: |
            echo Installing TypeScript...
            npm install -g typescript
            npm install --save-dev typescript

            echo Compiling TypeScript...
            npx tsc --version
            npx tsc src/tests/indexAzure.ts --outDir src/compile
          displayName: 'Build TypeScript App'

        - task: ArchiveFiles@2
          inputs:
            rootFolderOrFile: '$(Build.SourcesDirectory)/src/compile'  # Deploy only compiled files
            includeRootFolder: false
            archiveFile: '$(Build.ArtifactStagingDirectory)/drop/app.zip'
            replaceExistingArchive: true
          displayName: 'Archive Compiled Files'

        - task: PublishBuildArtifacts@1
          inputs:
            pathToPublish: '$(Build.ArtifactStagingDirectory)/drop/app.zip'
            artifactName: 'drop'  # ✅ This name must match DownloadBuildArtifacts!
          displayName: 'Publish Artifact'

- stage: Deploy
  displayName: 'Deploy to Azure Web App'
  jobs:
    - job: DeployApp
      steps:
        - task: DownloadBuildArtifacts@0
          inputs:
            buildType: 'current'  # ✅ Automatically downloads artifacts from the same pipeline
            artifactName: 'drop'  # ✅ Must match artifact name from PublishBuildArtifacts
            downloadPath: '$(Build.ArtifactStagingDirectory)'  # ✅ Correct property name

        - task: AzureWebApp@1
          inputs:
            azureSubscription: 'NewServiceConnection'  # Ensure this matches your Service Connection name
            appType: 'webApp'
            appName: 'NewAmazingWebApp'  # Replace with your actual Azure App Service name
            package: '$(Build.ArtifactStagingDirectory)/drop/app.zip'
          displayName: 'Deploy to Azure Web App'

        - task: AzureCLI@2
          inputs:
            azureSubscription: 'NewServiceConnection'
            scriptType: 'pscore'  # ✅ Use PowerShell Core (or use 'ps' for regular PowerShell)
            scriptLocation: 'inlineScript'
            inlineScript: |
              az webapp config set --resource-group MyResourceGroup --name NewAmazingWebApp --startup-file "node src/compile/indexAzure.js"
          displayName: 'Set Azure Web App Start Command'
