name: Playwright Tests

on:
  push:
    branches:
      - main  # Triggers the workflow on push to 'main'

jobs:
  test:
    strategy:
      matrix:
        project: [JenkinsApp, AzureApp]  # Runs tests for both projects
    runs-on: ubuntu-latest  # Runs on the latest Ubuntu environment

    env:
      COMPILED_DIR: ""
      TEST_FILE: ""

    steps:
      # Step 1: Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2: Set Project Variables (Fixed)
      - name: Set Environment Variables
        run: |
          if [[ "${{ matrix.project }}" == "JenkinsApp" ]]; then
            echo "COMPILED_DIR=compiledJenkins" >> $GITHUB_ENV
            echo "TEST_FILE=hello-world.spec.ts" >> $GITHUB_ENV
          else
            echo "COMPILED_DIR=compiledAzure" >> $GITHUB_ENV
            echo "TEST_FILE=hello-world.spec.ts" >> $GITHUB_ENV
          fi

      # Step 3: Debug Environment Variables (Verify they are set)
      - name: Debug Environment Variables
        run: |
          echo "✅ COMPILED_DIR=${{ env.COMPILED_DIR }}"
          echo "✅ TEST_FILE=${{ env.TEST_FILE }}"

      # Step 4: Install dependencies
      - name: Install Dependencies
        run: |
          cd ${{ matrix.project }}
          npm install

      # Step 5: Compile TypeScript to JavaScript
      - name: Compile TypeScript
        env:
          COMPILED_DIR: ${{ env.COMPILED_DIR }}
        run: |
          echo "🚀 Compiling TypeScript for ${{ matrix.project }}..."
          cd ${{ matrix.project }}
          npx tsc --project tsconfig.json
          echo "✅ Compilation complete."

      # Step 6: Debug Compiled Files
      - name: Debug Compiled Files
        env:
          COMPILED_DIR: ${{ env.COMPILED_DIR }}
        run: |
          echo "🔍 Checking compiled files in ${{ matrix.project }}/$COMPILED_DIR/"
          ls -R "${{ matrix.project }}/$COMPILED_DIR" || echo "⚠️ WARNING: Compiled directory is missing!"

      # Step 7: Install Playwright Browsers
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      # Step 8: Start Server (if required)
      - name: Start Server
        run: |
          echo "🚀 Starting server..."
          npm start &  # Run in the background

      - name: Wait for Server to be Ready
        run: |
          echo "⏳ Waiting for server at http://localhost:3000"
          npx wait-on http://localhost:3000 --timeout 60000  # Wait up to 60 seconds

      # Step 9: Run Playwright Tests (Headless Mode)
      - name: Run Playwright Tests (Headless Mode)
        env:
          TEST_FILE: ${{ env.TEST_FILE }}
        run: |
          echo "🔍 Running Playwright tests for ${{ matrix.project }}"
          echo "📂 Test File: ${{ matrix.project }}/$TEST_FILE"
          npx playwright test ${{ matrix.project }}/$TEST_FILE --headless

      # Step 10: Run Playwright Tests Using Xvfb (If Needed)
      - name: Run Playwright Tests (Using Xvfb for Headed Mode)
        if: failure()  # Run only if the headless tests fail
        env:
          TEST_FILE: ${{ env.TEST_FILE }}
        run: |
          echo "🔍 Running Playwright tests using Xvfb"
          xvfb-run --auto-servernum npx playwright test ${{ matrix.project }}/$TEST_FILE --headed

      # Step 11: Upload test results
      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.project }}
          path: ${{ matrix.project }}/test-results/
