name: Deploy to Jenkins & Azure

on:
  push:
    branches:
      - main  # Runs when code is pushed to the main branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # Increase timeout to prevent cancellation

    steps:
      # Step 1: Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2: Install Dependencies (Ignore Warnings)
      - name: Install Dependencies
        run: |
          cd JenkinsApp
          npm install --legacy-peer-deps || npm install --force

      # Step 3: Compile TypeScript (Only if needed)
      - name: Compile TypeScript
        run: |
          cd JenkinsApp
          if [ -f "tsconfig.json" ]; then
            echo "🚀 Compiling TypeScript..."
            npx tsc || echo "⚠️ TypeScript compilation failed but continuing..."
            echo "✅ Compilation complete."
          else
            echo "⚠️ No TypeScript config found, skipping compilation."
          fi

      # Step 4: Deploy to Jenkins (Only If `index.ts` Is Modified)
      - name: Deploy to Jenkins
        if: contains(github.event.head_commit.message, 'index.ts')
        run: |
          echo "🚀 Deploying to Jenkins..."
          curl -X POST "http://your-jenkins-server/job/your-job-name/build?token=YOUR_JENKINS_TOKEN"

      # Step 5: Deploy to Azure (Only If `indexAzure.ts` Is Modified)
      - name: Deploy to Azure
        if: contains(github.event.head_commit.message, 'indexAzure.ts')
        run: |
          echo "🚀 Deploying to Azure..."
          az webapp deployment source config-zip --resource-group YOUR_RESOURCE_GROUP --name YOUR_AZURE_APP_NAME --src YOUR_BUILD_ZIP
