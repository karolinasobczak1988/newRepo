name: Commit Code to GitHub

on:
  push:
    branches:
      - main  # Runs when code is pushed to the main branch

jobs:
  commit:
    strategy:
      matrix:
        project: [JenkinsApp, AzureApp]  # Handles both projects
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2: Install dependencies (only if needed for TypeScript compilation)
      - name: Install Dependencies
        run: |
          cd ${{ matrix.project }}
          npm install

      # Step 3: Compile TypeScript (if applicable)
      - name: Compile TypeScript
        run: |
          cd ${{ matrix.project }}
          if [ -f "tsconfig.json" ]; then
            echo "🚀 Compiling TypeScript..."
            npx tsc
            echo "✅ Compilation complete."
          else
            echo "⚠️ No TypeScript config found, skipping compilation."
          fi

      # Step 4: Commit & Push Changes (If Any)
      - name: Commit and Push Changes
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "Automated commit: Updated compiled files for ${{ matrix.project }}" || echo "No changes to commit"
          git push origin main
