name: Playwright Tests

on:
  push:
    branches:
      - main  # Triggers the workflow on push to 'main'

jobs:
  test:
    runs-on: ubuntu-latest  # Runs on the latest Ubuntu environment

    steps:
      # Step 1: Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v2

      # Step 2: Install dependencies (e.g., Playwright and other dependencies)
      - name: Install dependencies
        run: npm install

      # ✅ Step 3: Clean Previous Build (Ensure no old compiled files remain)
      - name: Clean Previous Build
        run: rm -rf src/compile

      # ✅ Step 4: Compile TypeScript to JavaScript
      - name: Compile TypeScript
        run: |
          echo "🚀 Compiling TypeScript..."
          npx tsc --project "$(pwd)/tsconfig.json"
          echo "✅ Compilation complete."

      # ✅ Step 5: Verify Compilation Output (Ensure index.js exists)
      - name: Debug Compiled Files
        run: |
          echo "🔍 Checking compiled files in src/compile/"
          ls -R "$(pwd)/src/compile/" || echo "⚠️ WARNING: src/compile directory is missing!"

      # ✅ Step 6: Start Express Server Using an Absolute Path
      - name: Start Express server
        run: |
          INDEX_PATH="$(pwd)/src/compile/tests/index.js"  # ✅ FIXED missing slash
          echo "🔍 Checking if compiled file exists at: $INDEX_PATH"
          if [ -f "$INDEX_PATH" ]; then
            echo "✅ index.js found! Starting Express server..."
            node "$INDEX_PATH" &
            npx wait-on http://localhost:3000
          else
            echo "❌ ERROR: Compiled index.js not found at $INDEX_PATH! Exiting..."
            exit 1
          fi

      # Step 7: Run Playwright Tests
      - name: Run Playwright Tests
        run: |
          npx playwright install  # Installs necessary browser binaries
          npx playwright test hello-world.spec.ts  # Runs Playwright test

      # Step 8: Upload test results as an artifact
      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
